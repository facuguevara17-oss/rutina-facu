document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:22px;width:100%;display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.05);border-radius:18px;overflow:hidden;\">\n            <sc-for list=\"{{ laps }}\" as=\"lp\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#1C1C1E;\">\n                <span style=\"font-size:15px;font-weight:600;color:rgba(235,235,245,.55);\">Vuelta {{ lp.i }}<\u002Fspan>\n                <span style=\"font-size:16px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;\">+{{ lp.split }}<\u002Fspan>\n                <span style=\"font-size:15px;font-weight:600;color:#B8FF26;font-variant-numeric:tabular-nums;\">{{ lp.total }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <div style=\"flex:0 0 86px;height:86px;background:rgba(18,18,20,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:flex-start;justify-content:space-around;padding:12px 24px 0;z-index:8;\">\n      <div onclick=\"{{ goHome }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:64px;\">\n        <svg width=\"25\" height=\"25\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.8Z\" stroke=\"{{ homeColor }}\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11px;font-weight:600;color:{{ homeColor }};\">Inicio<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{ goCycle }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:64px;\">\n        <svg width=\"25\" height=\"25\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"16\" rx=\"3\" stroke=\"{{ cycleColor }}\" stroke-width=\"1.9\"><\u002Frect><path d=\"M3.5 9h17M8 3v3M16 3v3\" stroke=\"{{ cycleColor }}\" stroke-width=\"1.9\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11px;font-weight:600;color:{{ cycleColor }};\">Ciclo<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{ goTimer }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:64px;\">\n        <svg width=\"25\" height=\"25\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"13.5\" r=\"7.5\" stroke=\"{{ timerColor }}\" stroke-width=\"1.9\"><\u002Fcircle><path d=\"M12 9.5v4l2.5 1.5M9.5 2.5h5M12 5.5v-3\" stroke=\"{{ timerColor }}\" stroke-width=\"1.9\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11px;font-weight:600;color:{{ timerColor }};\">Timer<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);z-index:9;\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:438,&quot;height&quot;:892}}\">\nclass Component extends DCLogic {\n  // ──────────────────────────────────────────────────────────────────────────\n  //  RUTINA — Ciclo de 9 días (Powerbuilding + HYROX)\n  //  👉 PARA EDITAR: cada ejercicio tiene\n  //     section → bloque dentro del día (Fuerza / Hipertrofia / etc.)\n  //     scheme  → series × reps   ·   rir → intensidad (RIR)   ·   load → carga (kg)\n  //     note    → indicación técnica   ('' = sin nota)\n  //     Cambia `load: '— kg'` por tu peso real cuando lo conozcas.\n  // ──────────────────────────────────────────────────────────────────────────\n  EX = {\n    // ─── DÍA 1 · TREN SUPERIOR (Fuerza + Hipertrofia) ───\n    upper: [\n      { section: 'Fuerza',      name: 'Press de Banca con Barra', scheme: '3 × 5',     rir: 'RIR 2', load: '— kg', note: 'Pausa 1″ en pecho · máx. velocidad concéntrica' },\n      { section: 'Fuerza',      name: 'Remo Pendlay',             scheme: '4 × 6-8',   rir: 'RIR 2', load: '— kg', note: 'Desde el suelo · explosivo hacia el ombligo' },\n      { section: 'Fuerza',      name: 'Press Militar con Barra',  scheme: '3 × 8',     rir: 'RIR 2', load: '— kg', note: 'Core estable · sin impulso de piernas' },\n      { section: 'Hipertrofia', name: 'Press Hammer (Palanca)',   scheme: '3 × 10-12', rir: 'RIR 1', load: '— kg', note: 'Control excéntrico · rango completo' },\n      { section: 'Hipertrofia', name: 'Dominadas Lastradas',      scheme: '3 × F-1',   rir: 'RIR 1', load: '— kg', note: 'Rango completo · hasta 1 rep antes del fallo' },\n      { section: 'Hipertrofia', name: 'Face Pull en Polea',       scheme: '3 × 20',    rir: 'RIR 0', load: '— kg', note: 'Rotación externa final · salud del manguito rotador' },\n    ],\n    // ─── DÍA 2 · TREN INFERIOR / CUÁDRICEPS (Potencia + Hipertrofia) ───\n    legs: [\n      { section: 'Potencia',    name: 'Trap Bar Jump Squat',      scheme: '4 × 5',     rir: 'RIR 3-4', load: '20-30% 1RM', note: 'Máxima altura · reset total entre saltos' },\n      { section: 'Hipertrofia', name: 'Sentadilla High Bar',      scheme: '3 × 6-8',   rir: 'RIR 2', load: '— kg', note: 'Enfoque en profundidad · técnica impecable' },\n      { section: 'Hipertrofia', name: 'Sentadilla Hack',          scheme: '3 × 10-12', rir: 'RIR 1', load: '— kg', note: 'Pies bajos · máx. flexión rodilla · activación quad' },\n      { section: 'Hipertrofia', name: 'Extensiones de Cuádriceps', scheme: '3 × 15',   rir: 'RIR 0', load: '— kg', note: 'Excéntrico 3 seg · pico de contracción' },\n      { section: 'Hipertrofia', name: 'Gemelo en Prensa',         scheme: '4 × 12',    rir: 'RIR 0', load: '— kg', note: 'Pausa 2″ en máximo estiramiento' },\n      { section: 'Core',        name: 'Ab Wheel (Rueda)',         scheme: '3 × 10',    rir: '',      load: 'Peso corporal', note: 'Estabilidad de columna · core antiextensión' },\n    ],\n    // ─── DÍA 5 · EMPUJE / PECHO + HOMBRO (Hipertrofia) ───\n    push: [\n      { section: 'Hipertrofia',     name: 'Press Inclinado Mancuernas',  scheme: '3 × 10-12', rir: 'RIR 1', load: '— kg', note: 'Máximo estiramiento pectoral superior' },\n      { section: 'Hipertrofia',     name: 'Dips (Fondos) con Lastre',    scheme: '3 × 10-12', rir: 'RIR 1', load: '— kg', note: 'Torso inclinado adelante · énfasis pecho' },\n      { section: 'Hipertrofia',     name: 'Elevaciones Laterales Polea', scheme: '4 × 15',    rir: 'RIR 0', load: '— kg', note: 'Tensión constante en todo el rango' },\n      { section: 'Hipertrofia',     name: 'Cruce de Poleas Altas',       scheme: '3 × 15',    rir: 'RIR 0', load: '— kg', note: 'Enfoque en la contracción · pico 1 seg' },\n      { section: 'Superset Tríceps', name: 'A · Extensión sobre la Cabeza', scheme: '3 × 12', rir: 'RIR 1', load: '— kg', note: 'Cabeza larga en máx. estiramiento · superset con B' },\n      { section: 'Superset Tríceps', name: 'B · Pushdown con Cuerda',     scheme: '3 × 15',    rir: 'RIR 0', load: '— kg', note: 'Sin descanso · cabeza lateral · separar la cuerda abajo' },\n    ],\n    // ─── DÍA 6 · TRACCIÓN / ESPALDA + BÍCEPS (Hipertrofia) ───\n    pull: [\n      { section: 'Hipertrofia', name: 'Remo con Barra (Prono)',   scheme: '4 × 10',    rir: 'RIR 1', load: '— kg', note: 'Tirón hacia la cadera · retracción escapular' },\n      { section: 'Hipertrofia', name: 'Jalón Neutro (Agarre V)',  scheme: '3 × 10-12', rir: 'RIR 1', load: '— kg', note: 'Codos a las costillas · dorsal máximo' },\n      { section: 'Hipertrofia', name: 'Remo Unilateral Máquina',  scheme: '3 × 12',    rir: 'RIR 1', load: '— kg', note: 'Máximo recorrido · estiramiento completo' },\n      { section: 'Hipertrofia', name: 'Pull-over Polea Alta',     scheme: '3 × 15',    rir: 'RIR 0', load: '— kg', note: 'Sin involucrar tríceps · énfasis dorsal largo' },\n      { section: 'Bíceps',      name: 'Curl Inclinado Mancuernas', scheme: '3 × 12',   rir: 'RIR 0', load: '— kg', note: 'Brazos detrás del torso · máximo stretch bíceps' },\n      { section: 'Bíceps',      name: 'Curl Martillo Polea',      scheme: '3 × 15',    rir: '',      load: '— kg', note: 'Énfasis braquial y antebrazo · tensión constante' },\n    ],\n    // ─── DÍA 7 · CADENA POSTERIOR (Fuerza + Hipertrofia) ───\n    posterior: [\n      { section: 'Fuerza',                name: 'Peso Muerto Convencional', scheme: '3 × 5',     rir: 'RIR 2', load: '— kg', note: 'Fuerza máxima de despegue · no redondear lumbar' },\n      { section: 'Hipertrofia Posterior', name: 'Peso Muerto Rumano',       scheme: '3 × 10-12', rir: 'RIR 1', load: '— kg', note: 'Bisagra de cadera profunda · isquios en elongación' },\n      { section: 'Hipertrofia Posterior', name: 'Hip Thrust',               scheme: '4 × 8-10',  rir: 'RIR 1', load: '— kg', note: 'Apretar glúteo 1″ arriba · pausa en contracción' },\n      { section: 'Hipertrofia Posterior', name: 'Zancadas Búlgaras',        scheme: '3 × 10 c/p', rir: 'RIR 1', load: '— kg', note: 'Unilateral · pie trasero elevado · control total' },\n      { section: 'Hipertrofia Posterior', name: 'Curl Femoral Tumbado',     scheme: '3 × 15',    rir: 'RIR 0', load: '— kg', note: 'Aislamiento de isquios · excéntrico 3 seg' },\n      { section: 'Funcionalidad',         name: \"Farmer's Walk\",            scheme: '3 × 40 m',  rir: '',      load: '— kg', note: 'Máximo agarre · core braced · funcionalidad pura' },\n    ],\n    // ─── DÍA 3 · HYROX CIRCUITO A (usa el cronómetro embebido) ───\n    hyrox1: [\n      { section: 'Circuito', name: 'Carrera',   scheme: '1000 m', rir: '', load: 'Ritmo Z3', note: '' },\n      { section: 'Circuito', name: 'SkiErg',    scheme: '500 m',  rir: '', load: '— W',      note: '' },\n      { section: 'Circuito', name: 'Sled Push', scheme: '25 m',   rir: '', load: '— kg',     note: '' },\n      { section: 'Circuito', name: 'Wall Balls', scheme: '20 reps', rir: '', load: '— kg',   note: '' },\n      { section: 'Circuito', name: 'Remo',      scheme: '500 m',  rir: '', load: '— W',      note: '' },\n    ],\n    // ─── DÍA 8 · HYROX CIRCUITO B (usa el cronómetro embebido) ───\n    hyrox2: [\n      { section: 'Circuito', name: 'Carrera',           scheme: '1000 m', rir: '', load: 'Ritmo Z3', note: '' },\n      { section: 'Circuito', name: 'Remo',              scheme: '1000 m', rir: '', load: '— W',  note: '' },\n      { section: 'Circuito', name: 'Burpee Broad Jump', scheme: '20 reps', rir: '', load: 'PC', note: '' },\n      { section: 'Circuito', name: 'Farmers Carry',     scheme: '50 m',   rir: '', load: '— kg', note: '' },\n      { section: 'Circuito', name: 'Sandbag Lunges',    scheme: '50 m',   rir: '', load: '— kg', note: '' },\n    ],\n  };\n\n  // Mapa del ciclo (9 días). type → estilo; ex → clave de EX (null = descanso).\n  DAYS = [\n    { n: 1, type: 'strength', title: 'Tren Superior · Fuerza',      tag: 'FUERZA',       ex: 'upper' },\n    { n: 2, type: 'strength', title: 'Tren Inferior · Cuádriceps',  tag: 'POTENCIA',     ex: 'legs' },\n    { n: 3, type: 'hyrox',    title: 'HYROX · Circuito A',          tag: 'METCON',       ex: 'hyrox1' },\n    { n: 4, type: 'rest',     title: 'Descanso Total',              tag: 'RECUPERACIÓN', ex: null },\n    { n: 5, type: 'strength', title: 'Empuje · Pecho + Hombro',     tag: 'HIPERTROFIA',  ex: 'push' },\n    { n: 6, type: 'strength', title: 'Tracción · Espalda + Bíceps', tag: 'HIPERTROFIA',  ex: 'pull' },\n    { n: 7, type: 'strength', title: 'Cadena Posterior',            tag: 'FUERZA',       ex: 'posterior' },\n    { n: 8, type: 'hyrox',    title: 'HYROX · Circuito B',          tag: 'METCON',       ex: 'hyrox2' },\n    { n: 9, type: 'rest',     title: 'Descanso Total',              tag: 'RECUPERACIÓN', ex: null },\n  ];\n\n  NEON = '#B8FF26';\n  MUTED = 'rgba(235,235,245,.5)';\n  TOTAL = 9;\n\n  state = {\n    view: 'home',\n    selDay: this._todayN(),\n    completed: this._load(),\n    timer: { running: false, ms: 0 },\n    laps: [],\n  };\n\n  _todayN() {\n    try {\n      let start = localStorage.getItem('facu_start');\n      if (!start) { start = String(Date.now()); localStorage.setItem('facu_start', start); }\n      const days = Math.floor((Date.now() - Number(start)) / 86400000);\n      return (days % 9) + 1;\n    } catch (e) { return 1; }\n  }\n  _weekday() {\n    const d = new Date();\n    const dn = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][d.getDay()];\n    const mn = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][d.getMonth()];\n    return dn + ' ' + d.getDate() + ' ' + mn;\n  }\n  _load() { try { return JSON.parse(localStorage.getItem('facu_done') || '{}'); } catch (e) { return {}; } }\n  _save(c) { try { localStorage.setItem('facu_done', JSON.stringify(c)); } catch (e) {} }\n\n  toggle(dayN, idx) {\n    this.setState(s => {\n      const c = { ...s.completed };\n      const d = { ...(c[dayN] || {}) };\n      d[idx] = !d[idx];\n      c[dayN] = d;\n      this._save(c);\n      return { completed: c };\n    });\n  }\n  openDay(n) { this.setState({ view: 'workout', selDay: n }); }\n\n  fmt(ms) {\n    const t = Math.floor(ms / 1000);\n    const m = String(Math.floor(t / 60)).padStart(2, '0');\n    const s = String(t % 60).padStart(2, '0');\n    return m + ':' + s;\n  }\n  toggleTimer() {\n    if (this.state.timer.running) {\n      clearInterval(this._int);\n      this.setState(s => ({ timer: { running: false, ms: s.timer.ms } }));\n    } else {\n      const startTs = Date.now() - this.state.timer.ms;\n      clearInterval(this._int);\n      this._int = setInterval(() => {\n        this.setState({ timer: { running: true, ms: Date.now() - startTs } });\n      }, 47);\n      this.setState({ timer: { running: true, ms: this.state.timer.ms } });\n    }\n  }\n  resetTimer() {\n    clearInterval(this._int);\n    this.setState({ timer: { running: false, ms: 0 }, laps: [] });\n  }\n  addLap() {\n    if (this.state.timer.ms === 0) return;\n    this.setState(s => ({ laps: [...s.laps, s.timer.ms] }));\n  }\n  componentWillUnmount() { clearInterval(this._int); }\n\n  _meta(type) {\n    if (type === 'rest') return { tagColor: this.MUTED, tagBg: 'rgba(235,235,245,.12)', bubbleBg: '#2C2C2E', bubbleColor: '#fff' };\n    return { tagColor: this.NEON, tagBg: 'rgba(184,255,38,.14)', bubbleBg: 'rgba(184,255,38,.16)', bubbleColor: this.NEON };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const todayN = this._todayN();\n\n    const sel = this.DAYS.find(d => d.n === s.selDay) || this.DAYS[0];\n    const selEx = sel.ex ? this.EX[sel.ex] : [];\n    const dmap = s.completed[sel.n] || {};\n    const doneCount = selEx.filter((_, i) => dmap[i]).length;\n    const total = selEx.length;\n    const wPct = total ? Math.round((doneCount / total) * 100) : 0;\n    const isTraining = sel.type !== 'rest';\n\n    let prevSection = null;\n    const exercises = selEx.map((e, i) => {\n      const done = !!dmap[i];\n      const showSection = e.section !== prevSection;\n      prevSection = e.section;\n      return {\n        name: e.name, scheme: e.scheme, load: e.load, note: e.note, hasNote: !!e.note,\n        rir: e.rir, hasRir: !!e.rir,\n        section: e.section, showSection,\n        boxBg: done ? this.NEON : 'transparent',\n        boxBorder: done ? this.NEON : 'rgba(255,255,255,.25)',\n        checkOp: done ? 1 : 0,\n        nameColor: done ? 'rgba(235,235,245,.4)' : '#fff',\n        nameDeco: done ? 'line-through' : 'none',\n        loadColor: done ? 'rgba(235,235,245,.4)' : 'rgba(235,235,245,.7)',\n        onToggle: () => this.toggle(sel.n, i),\n      };\n    });\n\n    const tday = this.DAYS.find(d => d.n === todayN) || this.DAYS[0];\n    const tEx = tday.ex ? this.EX[tday.ex] : [];\n    const tdm = s.completed[todayN] || {};\n    const tDone = tEx.filter((_, i) => tdm[i]).length;\n    const tPct = tEx.length ? tDone / tEx.length : 0;\n    const tm = this._meta(tday.type);\n    const CIRC = 213.6;\n    const today = {\n      n: todayN, total: this.TOTAL, weekday: this._weekday(),\n      typeTag: tday.tag, tagColor: tm.tagColor, tagBg: tm.tagBg,\n      title: tday.title,\n      pctText: Math.round(tPct * 100) + '%',\n      ringCirc: CIRC, ringOffset: CIRC * (1 - tPct),\n      ctaLabel: tday.type === 'rest' ? 'Ver descanso' : (tDone > 0 ? 'Continuar entreno' : 'Comenzar entreno'),\n      onStart: () => this.openDay(todayN),\n    };\n\n    const cycleDays = this.DAYS.map(d => {\n      const ex = d.ex ? this.EX[d.ex] : [];\n      const dm = s.completed[d.n] || {};\n      const dc = ex.filter((_, i) => dm[i]).length;\n      const m = this._meta(d.type);\n      const complete = ex.length > 0 && dc === ex.length;\n      const isToday = d.n === todayN;\n      return {\n        n: d.n, title: d.title, tag: d.tag,\n        tagColor: m.tagColor, bubbleBg: isToday ? this.NEON : m.bubbleBg, bubbleColor: isToday ? '#000' : m.bubbleColor,\n        borderCol: isToday ? 'rgba(184,255,38,.4)' : 'rgba(255,255,255,.05)',\n        exLabel: d.type === 'rest' ? 'Recuperación activa' : (dc + '/' + ex.length + ' ejercicios'),\n        complete, incomplete: !complete,\n        onOpen: () => this.openDay(d.n),\n      };\n    });\n    const upcoming = [];\n    for (let i = 1; i <= 4; i++) upcoming.push(cycleDays[(todayN - 1 + i) % 9]);\n\n    const ms = s.timer.ms;\n    const tt = Math.floor(ms / 1000);\n    const mm = String(Math.floor(tt / 60)).padStart(2, '0');\n    const ss = String(tt % 60).padStart(2, '0');\n    const cs = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');\n    const run = s.timer.running;\n    const laps = s.laps.map((lp, i) => ({\n      i: i + 1,\n      total: this.fmt(lp),\n      split: this.fmt(i === 0 ? lp : lp - s.laps[i - 1]),\n    }));\n\n    return {\n      statusTime: '9:41',\n      isHome: s.view === 'home', isCycle: s.view === 'cycle', isWorkout: s.view === 'workout', isTimer: s.view === 'timer',\n\n      today, upcoming, cycleDays,\n\n      wDay: {\n        n: sel.n, title: sel.title, tag: sel.tag,\n        isRest: sel.type === 'rest', isTraining,\n        isHyrox: sel.type === 'hyrox',\n        doneCount, total, pct: wPct, pctW: wPct + '%',\n      },\n      exercises, allDone: total > 0 && doneCount === total,\n\n      goHome: () => this.setState({ view: 'home' }),\n      goCycle: () => this.setState({ view: 'cycle' }),\n      goTimer: () => this.setState({ view: 'timer' }),\n      goBack: () => this.setState({ view: 'cycle' }),\n\n      homeColor: s.view === 'home' ? this.NEON : 'rgba(235,235,245,.45)',\n      cycleColor: (s.view === 'cycle' || s.view === 'workout') ? this.NEON : 'rgba(235,235,245,.45)',\n      timerColor: s.view === 'timer' ? this.NEON : 'rgba(235,235,245,.45)',\n\n      timeMM: mm, timeSS: ss, timeCenti: cs, hasLaps: s.laps.length > 0, laps,\n      timerRingAnim: run ? 'neonPulse 1.5s ease-in-out infinite' : 'none',\n      ringBorder: run ? 'rgba(184,255,38,.55)' : 'rgba(255,255,255,.08)',\n      timerGlow: run ? '0 0 26px rgba(184,255,38,.55)' : 'none',\n      centiColor: run ? this.NEON : 'rgba(235,235,245,.4)',\n      runLabel: run ? 'EN MARCHA' : (ms > 0 ? 'EN PAUSA' : 'LISTO'),\n      startLabel: run ? 'Detener' : (ms > 0 ? 'Reanudar' : 'Iniciar'),\n      startBg: run ? '#1C1C1E' : this.NEON,\n      startColor: run ? this.NEON : '#000',\n      startBorder: run ? '1.5px solid #B8FF26' : 'none',\n      startShadow: run ? 'none' : '0 10px 34px rgba(184,255,38,.32)',\n      toggleTimer: () => this.toggleTimer(),\n      resetTimer: () => this.resetTimer(),\n      addLap: () => this.addLap(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
